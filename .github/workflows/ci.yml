name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - run: npm install

      - name: Typecheck and bundle
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
